name: Validate, build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data (append-only history and claims checked against the previous state)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            node scripts/validate.mjs --base "$BASE"
          else
            node scripts/validate.mjs
          fi
      - name: Build
        run: node scripts/build.mjs --out dist
      - name: Build hypothesis scenarios
        run: |
          for f in data/hypotheses/*.json; do
            id=$(basename "$f" .json)
            node scripts/build.mjs --scenario "$id" --out "dist/scenarios/$id"
          done
      - name: Add the Corpus Geometriae reader
        run: mkdir -p dist/geometry && cp geometry/site.html dist/geometry/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
