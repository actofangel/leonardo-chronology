name: Corpus Geometriae

# Runs every sympy check when geometry/ changes, and on demand runs any query
# from the Actions tab (Run workflow). The result is written to the job summary.
on:
  push:
    paths: ["geometry/**", ".github/workflows/geometry.yml"]
  pull_request:
    paths: ["geometry/**", ".github/workflows/geometry.yml"]
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        options: [verify, list, part, prop, search, works, text, greek, archimedes, auctores, arch]
        default: verify
      argument:
        description: "Part id (euclid-II-11), Elements id (I.47), work and locus (archimedes.dimensio-circuli 3), Archimedes proposition (SC.I.34) or search text"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: geometry/requirements.txt
      - run: pip install -r geometry/requirements.txt
      - name: Run
        working-directory: geometry
        env:
          CMD: ${{ inputs.command || 'verify' }}
          ARG: ${{ inputs.argument }}
        run: |
          set +e
          python ops.py "$CMD" "$ARG" > report.md; status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Elements graph summary
        if: ${{ !inputs.command || inputs.command == 'verify' }}
        working-directory: geometry
        run: |
          { echo; echo '## Elements'; echo '```'; python elementa.py; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
